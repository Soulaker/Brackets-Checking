name: fetch-lora
on:
  workflow_dispatch:
    inputs:
      url:
        description: "direct download url"
        required: true
        default: "https://civitai.com/api/download/models/3014426"
      out:
        description: "output filename"
        required: true
        default: "model.safetensors"
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download
        run: |
          mkdir -p out
          echo "url: ${{ inputs.url }}"
          curl -L --retry 3 --retry-delay 5 --max-time 2100 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            -o "out/${{ inputs.out }}" "${{ inputs.url }}"
          ls -la out/
          head -c 16 "out/${{ inputs.out }}" | xxd | head -2 || true
      - uses: actions/upload-artifact@v4
        with:
          name: lora-file
          path: out/
          retention-days: 1
